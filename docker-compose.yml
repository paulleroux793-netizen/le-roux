# One-command local dev stack: Postgres + Rails + Vite.
#   docker compose up            # start everything (localhost:3000)
#   docker compose down          # stop
#   docker compose up --build    # rebuild after a Gemfile / package.json change
#
# Source is bind-mounted, so editing app/ reflects live. node_modules and the
# gem bundle are kept in the image/volumes so the Windows host tree can't
# shadow the Linux-native installs. This stack is DEV ONLY — never the live
# WhatsApp line. See ./Dockerfile (not this) for the production image.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dr_leroux_receptionist_development
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"          # exposed so you can connect a GUI client if you want
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true   # reap zombie esbuild/vite child procs over a long dev session
    command: bash -lc "bundle exec rails db:prepare && bundle exec rails server -b 0.0.0.0 -p 3000"
    env_file: .env.dev
    environment:
      # Where the Elixir-mirror importer reads the live system's daily exports.
      # Mounted READ-ONLY below — Ivory can never write back to Dr Chalita's folder.
      ELIXIR_DATA_ROOT: "/elixir_data"
      # Where completed intake packs are saved ("First Last YYYY-MM-DD.pdf").
      INTAKE_FILE_DIR: "/patient_files"
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
      - node_modules:/rails/node_modules   # keep Linux-native node_modules
      - rails_tmp:/rails/tmp               # Bootsnap cache/pids/sockets on fast storage, NOT the slow OneDrive mount
      - rails_log:/rails/log
      # READ-ONLY mount of the live Elixir export folder. The :ro flag is enforced
      # by the Docker kernel layer — the hard constraint (never touch Elixir data)
      # cannot be violated even by a bug in the importer.
      - "D:/Paul le Roux/OneDrive/1. Dr Chalita le Roux:/elixir_data:ro"
      # WRITABLE mount of ONLY the "1. Patient Files" folder, so completed intake
      # packs land there for reception to print + file. Scoped to this one folder —
      # the broad Dr Chalita le Roux mount above stays read-only.
      - "D:/Paul le Roux/OneDrive/1. Dr Chalita le Roux/1. Policies and Procedures/1. Patient Files:/patient_files"
    depends_on:
      db:
        condition: service_healthy

  vite:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    command: bash -lc "npm run dev -- --host 0.0.0.0 --port 3036"
    env_file: .env.dev
    environment:
      CHOKIDAR_USEPOLLING: "true"   # reliable file-watching over the Windows bind mount
      CHOKIDAR_INTERVAL: "300"
    ports:
      - "3036:3036"
    volumes:
      - .:/rails
      - node_modules:/rails/node_modules

volumes:
  pgdata:
  node_modules:
  rails_tmp:
  rails_log:
