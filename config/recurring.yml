#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  morning_confirmation:
    class: MorningConfirmationJob
    queue: default
    schedule: every day at 8am

  appointment_reminder_24h:
    class: AppointmentReminder24hJob
    queue: default
    schedule: every day at 8am

  appointment_reminder_1h:
    class: AppointmentReminder1hJob
    queue: default
    schedule: every hour

  appointment_no_confirmation:
    class: AppointmentNoConfirmationJob
    queue: default
    schedule: every day at 7:30am

  # Pull new Elixir exports + SIDEXIS scans into Ivory's read-only mirror tables
  # so the reconciliation dashboard and patient Imaging tab stay current without
  # anyone clicking "Scan". Idempotent — already-seen files are skipped.
  practice_data_sync:
    class: PracticeDataSyncJob
    queue: default
    schedule: every hour at minute 20
